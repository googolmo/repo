# MOSUMI Pacman repository.
# Install:
#   curl -fsSL https://repo-cr4.pages.dev/keys/repo.asc | sudo pacman-key --add -
#   sudo pacman-key --lsign-key 9DF42B7054F1CB5B
#   sudo curl -fsSL https://repo-cr4.pages.dev/pacman/mosumi-repo.conf \
#     -o /etc/pacman.d/mosumi-repo.conf
#   echo 'Include = /etc/pacman.d/mosumi-repo.conf' | sudo tee -a /etc/pacman.conf
#   sudo pacman -Sy imprint
#
# First Server hosts mosumi-repo.db + mosumi-repo.db.sig (this Cloudflare Pages tree).
# Package files 302 from /pacman/$arch/<file> to the Imprint GitHub Release.
[mosumi-repo]
SigLevel = PackageOptional DatabaseRequired
Server = https://repo-cr4.pages.dev/pacman/$arch
Server = https://github.com/googolmo/imprint/releases/download/v0.1.5
