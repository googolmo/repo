# Imprint Pacman repository.
# Install:
#   sudo curl -fsSL https://googolmo.github.io/repo/pacman/repo.conf \
#     -o /etc/pacman.d/repo
#   echo 'Include = /etc/pacman.d/repo' | sudo tee -a /etc/pacman.conf
#   sudo pacman -Sy imprint
#
# First Server hosts repo.db (this Cloudflare / Pages tree). update-index
# adds a second Server pointing at the Imprint GitHub Release for
# .pkg.tar.zst files.
[repo]
SigLevel = Optional TrustAll
Server = https://googolmo.github.io/repo/pacman/$arch
